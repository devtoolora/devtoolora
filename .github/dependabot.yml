version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Node types follow the Node 24 runtime.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # The VS Code types must stay within the engines.vscode range of the extension.
      - dependency-name: '@types/vscode'
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
